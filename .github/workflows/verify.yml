name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m py_compile droid.py b2/*.py

  shell:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check scripts
        run: bash -n scripts/*.sh

  arduino:
    name: Arduino Uno firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"
      - name: Install AVR core and LedControl
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install LedControl
      - name: Compile firmware
        run: |
          mkdir -p /tmp/b2_arduino
          cp arduino.ino /tmp/b2_arduino/b2_arduino.ino
          arduino-cli compile --fqbn arduino:avr:uno /tmp/b2_arduino
