[project]
name = "b2-droid"
version = "0.12.4"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "opencv-python-headless>=4.8",
    "face-recognition>=1.3",
    "piper-tts>=1.4.0",
    "pyserial>=3.5",
    "requests>=2.31",
    "litellm>=1.75,<2",
    "setuptools<81",
    "ultralytics>=8.0",
]

[project.optional-dependencies]
voices = ["resemblyzer>=0.1.4"]
slack = ["slack-sdk>=3.27"]

[tool.setuptools]
packages = ["b2"]
